    get:
      description: |-
        Requires permission: assignment:read
        Who drove which truck when, newest first. Filter by driver ("Ali's trucks"), by truck ("101's drivers") and by time: at = stints running at that instant ("who drove 101 at 14:30 on Tuesday?"); from/to = stints overlapping [from, to). Deleted trucks and drivers stay in the history.
      parameters:
      - description: Only this driver
        format: uuid
        in: query
        name: driver_id
        type: string
      - description: Only this truck
        format: uuid
        in: query
        name: truck_id
        type: string
      - description: Running at this instant (RFC 3339)
        format: date-time
        in: query
        name: at
        type: string
      - description: Overlapping [from, to) (RFC 3339)
        format: date-time
        in: query
        name: from
        type: string
      - description: Overlapping [from, to) (RFC 3339)
        format: date-time
        in: query
        name: to
        type: string
      - description: Platform users only
        format: uuid
        in: query
        name: company_id
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ListDriverAssignmentsResponse'
        "400":
          description: invalid filter
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "402":
          description: the company's subscription is not active
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission assignment:read
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Driver ↔ truck history
      tags:
      - assignments
