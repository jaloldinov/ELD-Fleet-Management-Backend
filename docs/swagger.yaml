      model:
        example: PT30
        type: string
      status:
        description: |-
          active: works. faulty: broken, may stay in its truck until replaced.
          retired: end of life, must be taken out of its truck first.
        enum:
        - active
        - faulty
        - retired
        example: faulty
        type: string
    type: object
  handler.UpdatePriceRequest:
    properties:
      is_active:
        description: false archives, true restores.
        example: false
        type: boolean
      nickname:
        example: Monthly (2026)
        type: string
    type: object
  handler.UpdateProductRequest:
    properties:
      description:
        example: Now with IFTA reports
        type: string
      is_active:
        description: false archives, true restores.
        example: true
        type: boolean
      name:
        example: ELD Fleet plan
        type: string
    type: object
  handler.UpdateRateLimitRequest:
    properties:
      limit:
        description: Maximum events per window, per key. 1-10000.
        example: 5
        type: integer
      window_seconds:
        description: Window length in seconds. 1-86400 (24 hours).
        example: 900
        type: integer
    type: object
  handler.UpdateTruckRequest:
    properties:
      is_active:
        description: 'Older way to set the status: true = active, false = out_of_service.'
        example: false
        type: boolean
      license_plate:
        example: XYZ9876
        type: string
      make:
        example: Volvo
        type: string
      model:
        example: VNL 860
        type: string
      plate_state:
        example: OK
        type: string
      status:
        description: |-
          active: on the road. in_maintenance: in the shop (drivers come off,
          the ELD stays). out_of_service: left the fleet (drivers and ELD come
          off; no longer billed).
        enum:
        - active
        - in_maintenance
        - out_of_service
        example: in_maintenance
        type: string
      unit_number:
        example: 101A
        type: string
      year:
        example: 2023
        type: integer
    type: object
  handler.UpdateUserRequest:
    properties:
      first_name:
        example: Jane
        type: string
      is_active:
        example: false
        type: boolean
      last_name:
        example: Smith
        type: string
      roles:
        example:
        - dispatcher
        - manager
        items:
          type: string
        type: array
    type: object
  handler.UsageResponse:
    properties:
      active_trucks:
        description: 'Active trucks: the quantity of per-truck prices.'
        example: 12
        type: integer
    type: object
  handler.UserResponse:
    properties:
      company_id:
        description: Null for platform users.
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      email:
        example: jane@acme.com
        type: string
      first_name:
        example: Jane
        type: string
      id:
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      last_login_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      last_name:
        example: Smith
        type: string
      roles:
        example:
        - dispatcher
        items:
          type: string
        type: array
      username:
        example: jane.smith
        type: string
    type: object
  handler.VerifyResetCodeRequest:
    properties:
      code:
        description: The 6-digit code from the email.
        example: "048213"
        type: string
      email:
        example: jane@acme.com
        type: string
    type: object
  handler.VerifyResetCodeResponse:
    properties:
      expires_in:
        description: Seconds until the reset token expires.
        example: 600
        type: integer
      reset_token:
        description: 'Single use: send it to /api/v1/auth/password/reset.'
        example: pX3k9Q0m1yG2ZzVb0bq3s9Xc4m5n6o7p8q9r0s1t2u3
        type: string
    type: object
info:
  contact: {}
  description: 'Backend for US motor carriers: companies, users, drivers, trucks and
    ELD devices.'
  title: ELD Fleet Management API
  version: "1.0"
paths:
  /api/v1/audit-logs:
    get:
      description: |-
        Requires permission: audit:read
        Who changed what and when, newest first. Company users see only their own company's records (company_id is ignored).
        For one record's history (e.g. a timeline in the UI), filter by entity and entity_id.
      parameters:
      - description: Entity type
        enum:
        - company
        - user
        - driver
        - truck
        - eld_device
        - rate_limit
        - product
        - price
        - subscription
        - invoice
        in: query
        name: entity
        type: string
      - description: ID of one record (with entity)
        in: query
        name: entity_id
        type: string
      - description: Exact action, e.g. truck.update
        in: query
        name: action
        type: string
      - description: Who made the change
        format: uuid
        in: query
        name: actor_id
        type: string
      - description: Platform users only
        format: uuid
        in: query
        name: company_id
        type: string
      - description: Changes at or after (RFC 3339)
        format: date-time
        in: query
        name: from
        type: string
      - description: Changes before (RFC 3339)
        format: date-time
        in: query
        name: to
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ListAuditLogsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission audit:read
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: List audit log entries
      tags:
      - audit
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges a login (email or username) and password for an access token and a refresh token.
        Unknown user and wrong password return the same 401 on purpose.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: invalid login or password
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many attempts (rate limits auth_requests or login_attempts,
            see /api/v1/rate-limits); see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: Log in
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        Ends the session of the given refresh token. Always 204, even for unknown tokens.
        The access token stays valid until it expires (max 15 minutes); clients should discard it.
      parameters:
      - description: Refresh token of the session to end
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests from this IP; see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: Log out
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user, their roles and effective permissions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MeResponse'
        "401":
          description: missing/invalid token, or the user no longer exists
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/password/forgot:
    post:
      consumes:
      - application/json
      description: |-
        Step 1 of 3. Emails a 6-digit code (valid 10 minutes, 5 attempts) if the address belongs to an active account.
        Always answers 202 with the same message, so it never reveals whether an account exists.
        Users without an email address (username-only drivers) must ask an administrator.
      parameters:
      - description: Account email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handler.ForgotPasswordResponse'
        "400":
          description: invalid JSON or email
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests (rate limits password_reset_requests or auth_requests);
            see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: 'Forgot password: email a code'
      tags:
      - auth
  /api/v1/auth/password/reset:
    post:
      consumes:
      - application/json
      description: Step 3 of 3. Sets the new password, ends every session of the user
        (log in again) and emails a notice.
      parameters:
      - description: Reset token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ResetPasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid JSON, weak new_password, or invalid_reset_token
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests from this IP; see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: 'Forgot password: set a new password'
      tags:
      - auth
  /api/v1/auth/password/verify:
    post:
      consumes:
      - application/json
      description: |-
        Step 2 of 3. Exchanges the emailed code for a single-use reset token (valid 10 minutes).
        Each wrong code uses one of the 5 attempts; then a new code must be requested.
      parameters:
      - description: Email and code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyResetCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.VerifyResetCodeResponse'
        "400":
          description: invalid JSON, or invalid_reset_code (wrong, expired or used
            up)
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests from this IP; see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: 'Forgot password: verify the code'
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges a refresh token for a new access + refresh token pair.
        The presented refresh token stops working (rotation). Presenting it again is treated as theft and ends all sessions of the user.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: invalid or expired refresh token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests from this IP; see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/billing/config:
    get:
      description: |-
        Login only. The Stripe publishable key the page needs to load Stripe.js (public by design).
        The route exists only when billing is enabled.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BillingConfigResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Billing settings for the browser
      tags:
      - billing
  /api/v1/billing/metrics:
    get:
      description: |-
        Requires permission: billing_metrics:read (platform only). MRR, subscriptions and companies by status, outstanding invoices, payment failures and monthly revenue.
        Computed from our copies (no Stripe calls).
      parameters:
      - default: 12
        description: How many months of history, the current one included
        in: query
        maximum: 36
        minimum: 1
        name: months
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BillingMetricsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission billing_metrics:read, or not a platform
            user
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Billing dashboard
      tags:
      - billing
  /api/v1/companies:
    get:
      description: |-
        Returns companies ordered by creation time. page_size is capped at 100.
        Platform users see all companies; company users see only their own.
        Requires permission: company:read
      parameters:
      - default: 1
        description: Page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ListCompaniesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission company:read
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: List companies
      tags:
      - companies
    post:
      consumes:
      - application/json
      description: |-
        Creates a motor carrier (tenant). New companies are active.
        Requires permission: company:create
      parameters:
      - description: Company to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateCompanyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created company
              type: string
          schema:
            $ref: '#/definitions/handler.CompanyResponse'
        "400":
          description: invalid JSON or validation failed
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission company:create
          schema:
            $ref: '#/definitions/apierror.Response'
        "409":
          description: DOT number already used
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Create a company
      tags:
      - companies
  /api/v1/companies/{id}:
    delete:
      description: |-
        Soft delete: the company is hidden but kept for history.
        Requires permission: company:delete
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission company:delete
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Delete a company
      tags:
      - companies
    get:
      description: 'Requires permission: company:read'
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CompanyResponse'
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission company:read
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Get a company
      tags:
      - companies
    patch:
      consumes:
      - application/json
      description: |-
        Partial update: only the fields present in the body are changed.
        Requires permission: company:update
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CompanyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission company:update
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "409":
          description: DOT number already used
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Update a company
      tags:
      - companies
  /api/v1/companies/{id}/billing/balance:
    get:
      description: 'Requires permission: invoice:read. Company users: own company
        only. Negative balance = credit that pays the next invoices.'
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BalanceResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission invoice:read
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: company not found
          schema:
            $ref: '#/definitions/apierror.Response'
        "502":
          description: Stripe refused the request or could not be reached
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Credit balance
      tags:
      - billing
  /api/v1/companies/{id}/billing/charges:
    post:
      consumes:
      - application/json
      description: |-
        Requires permission: invoice:manage (platform only). A separate invoice with one line ("ELD installation").
        Prorations waiting for the next renewal are not included. With charge_now, a decline (or no default card) is returned in payment_error and the invoice stays open.
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Charge
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateChargeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.ChargeResponse'
        "400":
          description: validation failed
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission invoice:manage, or not a platform user
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: company not found
          schema:
            $ref: '#/definitions/apierror.Response'
        "502":
          description: Stripe refused the request or could not be reached
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: One-off charge
      tags:
      - billing
  /api/v1/companies/{id}/billing/credits:
    post:
      consumes:
      - application/json
      description: 'Requires permission: credit:manage (platform only). Added to the
        balance; Stripe uses it for the next invoices.'
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Credit
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.AddCreditRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.BalanceTransactionResponse'
        "400":
          description: validation failed
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission credit:manage, or not a platform user
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: company not found
          schema:
            $ref: '#/definitions/apierror.Response'
        "502":
          description: Stripe refused the request or could not be reached
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
