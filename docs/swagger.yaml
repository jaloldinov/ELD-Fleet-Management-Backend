basePath: /
definitions:
  handler.CompanyResponse:
    properties:
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      dot_number:
        example: "1234567"
        type: string
      id:
        description: Company ID (UUIDv7, time-ordered).
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/Chicago
        type: string
      updated_at:
        example: "2026-10-02T11:26:26Z"
        type: string
    type: object
  handler.CreateCompanyRequest:
    properties:
      dot_number:
        example: "1234567"
        type: string
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/Chicago
        type: string
    type: object
  handler.ErrorBody:
    properties:
      code:
        example: validation_failed
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      message:
        example: request validation failed
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/handler.ErrorBody'
    type: object
  handler.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  handler.ListCompaniesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.CompanyResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 57
        type: integer
    type: object
  handler.LoginRequest:
    properties:
      login:
        description: Email or username.
        example: admin@example.com
        type: string
      password:
        example: correct horse battery staple
        type: string
    type: object
  handler.MeResponse:
    properties:
      company_id:
        description: Null for platform users.
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      email:
        example: jane@acme.com
        type: string
      first_name:
        example: Jane
        type: string
      id:
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      last_login_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      last_name:
        example: Smith
        type: string
      permissions:
        example:
        - truck:read
        - driver:read
        items:
          type: string
        type: array
      username:
        example: jane.smith
        type: string
    type: object
  handler.ReadyResponse:
    properties:
      database:
        example: up
        type: string
      status:
        example: ok
        type: string
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        example: q3Jx0yJ8Q0m1yG2ZzVb0bq3s9Xc4m5n6o7p8q9r0s1t
        type: string
    type: object
  handler.TokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        description: Seconds until the access token expires.
        example: 900
        type: integer
      refresh_expires_in:
        description: Seconds until the refresh token (the session) expires.
        example: 2592000
        type: integer
      refresh_token:
        description: 'Single-use: exchange it at /api/v1/auth/refresh for a new pair.'
        example: q3Jx0yJ8Q0m1yG2ZzVb0bq3s9Xc4m5n6o7p8q9r0s1t
        type: string
      token_type:
        description: 'Always "Bearer": send the token as "Authorization: Bearer <access_token>".'
        example: Bearer
        type: string
    type: object
  handler.UpdateCompanyRequest:
    properties:
      dot_number:
        example: "1234567"
        type: string
      is_active:
        example: false
        type: boolean
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/New_York
        type: string
    type: object
info:
  contact: {}
  description: 'Backend for US motor carriers: companies, users, drivers, trucks and
    ELD devices.'
  title: ELD Fleet Management API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges a login (email or username) and password for an access token and a refresh token.
        Unknown user and wrong password return the same 401 on purpose.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: invalid login or password
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        Ends the session of the given refresh token. Always 204, even for unknown tokens.
        The access token stays valid until it expires (max 15 minutes); clients should discard it.
      parameters:
      - description: Refresh token of the session to end
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Log out
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user and their effective permissions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MeResponse'
        "401":
          description: missing/invalid token, or the user no longer exists
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges a refresh token for a new access + refresh token pair.
        The presented refresh token stops working (rotation). Presenting it again is treated as theft and ends all sessions of the user.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: invalid or expired refresh token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/companies:
    get:
      description: |-
        Returns companies ordered by creation time. page_size is capped at 100.
        Requires permission: company:read
      parameters:
      - default: 1
        description: Page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ListCompaniesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission company:read
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List companies
      tags:
      - companies
    post:
      consumes:
      - application/json
      description: |-
        Creates a motor carrier (tenant). New companies are active.
        Requires permission: company:create
      parameters:
      - description: Company to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateCompanyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created company
              type: string
          schema:
            $ref: '#/definitions/handler.CompanyResponse'
        "400":
          description: invalid JSON or validation failed
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission company:create
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: DOT number already used
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a company
      tags:
      - companies
  /api/v1/companies/{id}:
    delete:
      description: |-
        Soft delete: the company is hidden but kept for history.
        Requires permission: company:delete
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission company:delete
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a company
      tags:
      - companies
    get:
      description: 'Requires permission: company:read'
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CompanyResponse'
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission company:read
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a company
      tags:
      - companies
    patch:
      consumes:
      - application/json
      description: |-
        Partial update: only the fields present in the body are changed.
        Requires permission: company:update
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CompanyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission company:update
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: DOT number already used
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a company
      tags:
      - companies
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Liveness check
      tags:
      - health
  /ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ReadyResponse'
      summary: Readiness check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: 'Access token from /api/v1/auth/login. Enter: Bearer <access_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
