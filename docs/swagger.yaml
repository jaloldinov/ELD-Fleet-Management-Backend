          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - DeviceKey: []
      summary: Who am I (device)
      tags:
      - device
  /api/v1/device/telemetry:
    post:
      consumes:
      - application/json
      description: |-
        For ELD devices: a batch of up to 500 readings (also the way to sync after being offline). Every point gets a final answer: accepted, duplicate (its seq was stored before; resending is safe) or rejected with a reason. Each point is filed under the truck the device was installed in at its recorded_at. Authorization: Device <key>. Not behind the billing gate.
        Time rules: recorded_at at most 10 minutes in the future (FMCSA timing rule), at most 30 days old, not after sent_at; and seq order must match time order (a higher seq recorded earlier means the clock went backwards).
      parameters:
      - description: Readings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.TelemetryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TelemetryResponse'
        "400":
          description: no points, more than 500, or malformed JSON
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing, unknown or revoked device key
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: the device is retired
          schema:
            $ref: '#/definitions/apierror.Response'
        "413":
          description: body too large
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - DeviceKey: []
      summary: Send readings (device)
      tags:
      - device
