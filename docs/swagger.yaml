      - rate-limits
    patch:
      consumes:
      - application/json
      description: |-
        Requires permission: ratelimit:update (platform users only)
        Partial update. Saved in the database and applied immediately on this instance; other instances apply it within a minute.
        Keys that already used up their attempts are not reset: their tokens come back at the new rate.
      parameters:
      - description: Rule name
        enum:
        - auth_requests
        - login_attempts
        in: path
        name: name
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateRateLimitRequest'
