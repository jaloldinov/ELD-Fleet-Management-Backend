    get:
      description: 'For ELD devices: the calling device and the truck it is installed
        in. Authorization: Device <key>. Not behind the billing gate (logging hours
        of service is required by law).'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.DeviceSelfResponse'
        "401":
          description: missing, unknown or revoked device key
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: the device is retired
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
