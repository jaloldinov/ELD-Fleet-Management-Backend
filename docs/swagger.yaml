          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Set a user's password
      tags:
      - users
  /api/v1/webhooks/stripe:
    post:
      consumes:
      - application/json
      description: |-
        Called by Stripe, not by clients. No token: the Stripe-Signature header proves the sender.
        200 = handled (or not needed); 400 = not signed by Stripe; 500 = failed, Stripe retries for up to 3 days.
      parameters:
      - description: Signature made by Stripe with the webhook secret
        in: header
        name: Stripe-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: invalid signature
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: Stripe webhook
      tags:
      - billing
