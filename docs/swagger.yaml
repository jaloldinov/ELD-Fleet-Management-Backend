  /api/v1/companies/{id}/billing/subscription:
    get:
      description: |-
        Requires permission: subscription:read. Company users: own company only.
        The subscription that has not ended (any status but canceled and incomplete_expired), as last synced from Stripe.
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SubscriptionResponse'
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission subscription:read
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: no current subscription (or company not found)
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: The company's current subscription
      tags:
      - billing
    post:
      consumes:
      - application/json
      description: |-
        Requires permission: subscription:manage. Company users: own company only.
        Starts the subscription as "incomplete" with an open first invoice; nothing is charged yet.
        Pay it in the browser with Stripe.js using payment.client_secret, then call .../subscription/refresh: the status becomes "active".
        Per-truck prices are billed for the company's active trucks; flat prices once. Needs a default card.
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Prices to subscribe to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateSubscriptionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.SubscriptionStateResponse'
        "400":
          description: 'validation failed: unknown/archived price, mixed intervals,
            no default card'
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission subscription:manage
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: company not found
          schema:
            $ref: '#/definitions/apierror.Response'
        "409":
          description: the company already has a subscription
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
        "502":
          description: Stripe refused the request or could not be reached
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Subscribe (pay first)
      tags:
      - billing
    put:
      consumes:
      - application/json
      description: |-
        Requires permission: subscription:manage. Body = the WHOLE new plan.
        Upgrades are charged now (prorated) and applied only once paid; downgrades leave credit for the unused time.
        If payment is not null, the bank asks for 3-D Secure: pay in the browser, then refresh. The old plan stays until then.
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: The new plan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ChangeSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SubscriptionStateResponse'
        "400":
          description: validation failed, or the preview expired (proration_date)
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "402":
          description: 'card_declined: the bank refused the payment; the plan did
            not change'
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission subscription:manage
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: no current subscription (or company not found)
          schema:
            $ref: '#/definitions/apierror.Response'
        "502":
          description: Stripe refused the request or could not be reached
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Change the plan
      tags:
      - billing
