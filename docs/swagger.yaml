basePath: /
definitions:
  apierror.Body:
    properties:
      code:
        example: validation_failed
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      message:
        example: request validation failed
        type: string
    type: object
  apierror.Response:
    properties:
      error:
        $ref: '#/definitions/apierror.Body'
    type: object
  handler.AssignTruckRequest:
    properties:
      truck_id:
        format: uuid
        type: string
    type: object
  handler.AuditActor:
    properties:
      id:
        format: uuid
        type: string
      name:
        example: Jane Smith
        type: string
    type: object
  handler.AuditChangeResponse:
    properties:
      new: {}
      old: {}
    type: object
  handler.AuditLogResponse:
    properties:
      action:
        example: truck.update
        type: string
      actor:
        allOf:
        - $ref: '#/definitions/handler.AuditActor'
        description: null = the system itself (e.g. the createadmin CLI).
      changes:
        additionalProperties:
          $ref: '#/definitions/handler.AuditChangeResponse'
        description: |-
          Only the fields that changed: {"unit_number": {"old": "101", "new": "101A"}}.
          null for actions without values (delete, password changes).
        type: object
      company_id:
        format: uuid
        type: string
      entity:
        example: truck
        type: string
      entity_id:
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        type: string
      id:
        format: uuid
        type: string
      occurred_at:
        example: "2026-10-03T11:26:26Z"
        type: string
      request_id:
        example: 9c1a1ea6-d4cb-4085-a373-493ea2077a6c
        type: string
    type: object
  handler.BillingConfigResponse:
    properties:
      publishable_key:
        description: Public key of our Stripe account, for Stripe("pk_...").
        example: pk_test_51Qabc
        type: string
    type: object
  handler.CompanyResponse:
    properties:
      billing_status:
        description: |-
          Follows the subscription: none, pending (first invoice unpaid), active,
          past_due (payment failed, grace period), blocked. Fleet routes need
          active or past_due when billing is enabled.
        example: active
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      dot_number:
        example: "1234567"
        type: string
      id:
        description: Company ID (UUIDv7, time-ordered).
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/Chicago
        type: string
      updated_at:
        example: "2026-10-02T11:26:26Z"
        type: string
    type: object
  handler.CreateCompanyRequest:
    properties:
      dot_number:
        example: "1234567"
        type: string
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/Chicago
        type: string
    type: object
  handler.CreateDriverRequest:
    properties:
      company_id:
        description: 'Platform users: required. Company users: omit (their own company
          is used).'
        format: uuid
        type: string
      email:
        description: Email and/or username. Drivers often have only a username.
        example: ""
        type: string
      first_name:
        example: Bob
        type: string
      last_name:
        example: Lee
        type: string
      license_expires_at:
        description: Calendar day, YYYY-MM-DD.
        example: "2028-05-31"
        type: string
      license_number:
        example: D1234567
        type: string
      license_state:
        description: Two-letter US state code.
        example: TX
        type: string
      password:
        example: correct horse battery staple
        type: string
      username:
        example: driver.bob
        type: string
    type: object
  handler.CreateELDDeviceRequest:
    properties:
      company_id:
        description: 'Platform users: required. Company users: omit (their own company
          is used).'
        format: uuid
        type: string
      firmware_version:
        example: 1.2.3
        type: string
      model:
        example: PT30
        type: string
      serial_number:
        description: Hardware serial, 4-32 letters/digits/hyphens. Cannot be changed
          later.
        example: PT30-0001
        type: string
    type: object
  handler.CreatePriceRequest:
    properties:
      billing_unit:
        description: company = flat amount per company; truck = per active truck.
          Never changes later.
        enum:
        - company
        - truck
        example: truck
        type: string
      interval:
        description: month or year. Never changes later.
        enum:
        - month
        - year
        example: month
        type: string
      nickname:
        example: Monthly
        type: string
      unit_amount:
        description: 'Amount in cents: 2500 = $25.00. 0 to 99999999. Never changes
          later.'
        example: 2500
        type: integer
    type: object
  handler.CreateProductRequest:
    properties:
      description:
        example: Hours of service and DVIR for every truck
        type: string
      name:
        example: ELD Fleet plan
        type: string
    type: object
  handler.CreateSubscriptionRequest:
    properties:
      price_ids:
        description: One price per product, all with the same interval (all monthly
          or all yearly).
        example:
        - 0199a1b2-0000-7000-8000-0000000000b1
        items:
          type: string
        type: array
    type: object
  handler.CreateTruckRequest:
    properties:
      company_id:
        description: 'Platform users: required. Company users: omit (their own company
          is used).'
        format: uuid
        type: string
      license_plate:
        example: ABC1234
        type: string
      make:
        example: Freightliner
        type: string
      model:
        example: Cascadia
        type: string
      plate_state:
        example: TX
        type: string
      unit_number:
        description: The carrier's own truck number.
        example: "101"
        type: string
      vin:
        description: 17 characters; the check digit is validated. Cannot be changed
          later.
        example: 1M8GDM9AXKP042788
        type: string
      year:
        example: 2022
        type: integer
    type: object
  handler.CreateUserRequest:
    properties:
      company_id:
        description: |-
          Platform users only: the company the new user belongs to (omit for a
          platform user). Company users may omit it; their own company is used.
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
        format: uuid
        type: string
      email:
        description: Email and/or username; at least one is required.
        example: jane@acme.com
        type: string
      first_name:
        example: Jane
        type: string
      last_name:
        example: Smith
        type: string
      password:
        description: 8 characters to 72 bytes.
        example: correct horse battery staple
        type: string
      roles:
        example:
        - dispatcher
        items:
          type: string
        type: array
      username:
        example: jane.smith
        type: string
    type: object
  handler.DriverResponse:
    properties:
      company_id:
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      email:
        example: bob@acme.com
        type: string
      first_name:
        example: Bob
        type: string
      id:
        format: uuid
        type: string
      is_active:
        description: 'Follows the user account: a deactivated user is an inactive
          driver.'
        example: true
        type: boolean
      last_name:
        example: Lee
        type: string
      license_expires_at:
        example: "2028-05-31"
        type: string
      license_number:
        example: D1234567
        type: string
      license_state:
        example: TX
        type: string
      user_id:
        format: uuid
        type: string
      username:
        example: driver.bob
        type: string
    type: object
  handler.ELDDeviceResponse:
    properties:
      company_id:
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      firmware_version:
        example: 1.2.3
        type: string
      id:
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      model:
        example: PT30
        type: string
      serial_number:
        example: PT30-0001
        type: string
      truck_id:
        description: null = not installed
        format: uuid
        type: string
      updated_at:
        example: "2026-10-02T11:26:26Z"
        type: string
    type: object
  handler.ForgotPasswordRequest:
    properties:
      email:
        example: jane@acme.com
        type: string
    type: object
  handler.ForgotPasswordResponse:
    properties:
      message:
        example: If an account with this email exists, a reset code has been sent.
        type: string
    type: object
  handler.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  handler.ListAuditLogsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.AuditLogResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 3
        type: integer
    type: object
  handler.ListCompaniesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.CompanyResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 57
        type: integer
    type: object
  handler.ListDriversResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.DriverResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 8
        type: integer
    type: object
  handler.ListELDDevicesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.ELDDeviceResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 14
        type: integer
    type: object
  handler.ListPaymentMethodsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.PaymentMethodResponse'
        type: array
    type: object
  handler.ListProductsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.ProductResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 3
        type: integer
    type: object
  handler.ListRateLimitsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.RateLimitResponse'
        type: array
    type: object
  handler.ListSubscriptionsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.SubscriptionResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 4
        type: integer
    type: object
  handler.ListTrucksResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.TruckResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 14
        type: integer
    type: object
  handler.ListUsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.UserResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 12
        type: integer
    type: object
  handler.LoginRequest:
    properties:
      login:
        description: Email or username.
        example: admin@example.com
        type: string
      password:
        example: correct horse battery staple
        type: string
    type: object
  handler.MeResponse:
    properties:
      company_id:
        description: Null for platform users.
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      email:
        example: jane@acme.com
        type: string
      first_name:
        example: Jane
        type: string
      id:
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      last_login_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      last_name:
        example: Smith
        type: string
      permissions:
        example:
        - truck:read
        - driver:read
        items:
          type: string
        type: array
      roles:
        example:
        - dispatcher
        items:
          type: string
        type: array
      username:
        example: jane.smith
        type: string
    type: object
  handler.PaymentDueResponse:
    properties:
      amount_due:
        example: 40000
        type: integer
      client_secret:
        description: 'For stripe.confirmPayment({clientSecret, confirmParams: {payment_method}}).'
        example: pi_1Qabc_secret_xyz
        type: string
      invoice_id:
        example: in_1QabcDEF
        type: string
      payment_method_id:
        example: pm_1QabcDEF
        type: string
    type: object
  handler.PaymentMethodResponse:
    properties:
      brand:
        example: visa
        type: string
      exp_month:
        example: 12
        type: integer
      exp_year:
        example: 2030
        type: integer
      id:
        example: pm_1QabcDEFghiJKL
        type: string
      is_default:
        example: true
        type: boolean
      last4:
        example: "4242"
        type: string
    type: object
  handler.PriceResponse:
    properties:
      billing_unit:
        example: truck
        type: string
      created_at:
        example: "2026-10-06T11:26:26Z"
        type: string
      currency:
        example: usd
        type: string
      id:
        format: uuid
        type: string
      interval:
        example: month
        type: string
      is_active:
        example: true
        type: boolean
      nickname:
        example: Monthly
        type: string
      product_id:
        format: uuid
        type: string
      stripe_price_id:
        description: 'Stripe''s id: find the price in the Stripe Dashboard.'
        example: price_1QabcDEFghiJKL
        type: string
      unit_amount:
        example: 2500
        type: integer
    type: object
  handler.ProductResponse:
    properties:
      created_at:
        example: "2026-10-06T11:26:26Z"
        type: string
      description:
        example: Hours of service and DVIR for every truck
        type: string
      id:
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: ELD Fleet plan
        type: string
      prices:
        items:
          $ref: '#/definitions/handler.PriceResponse'
        type: array
      stripe_product_id:
        example: prod_QabcDEFghiJKL
        type: string
      updated_at:
        example: "2026-10-06T11:26:26Z"
        type: string
    type: object
  handler.RateLimitResponse:
    properties:
      description:
        example: Login attempts per login name + client IP; a successful login resets
          it
        type: string
      limit:
        example: 5
        type: integer
      name:
        description: |-
          auth_requests: per client IP, all /api/v1/auth/* routes.
          login_attempts: per login name + client IP, POST /api/v1/auth/login.
        example: login_attempts
        type: string
      updated_at:
        example: "2026-10-03T11:26:26Z"
        type: string
      updated_by:
        format: uuid
        type: string
      window_seconds:
        example: 900
        type: integer
    type: object
  handler.ReadyResponse:
    properties:
      database:
        example: up
        type: string
      status:
        example: ok
        type: string
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        example: q3Jx0yJ8Q0m1yG2ZzVb0bq3s9Xc4m5n6o7p8q9r0s1t
        type: string
    type: object
  handler.ResetPasswordRequest:
    properties:
      new_password:
        example: correct horse battery staple
        type: string
      reset_token:
        example: pX3k9Q0m1yG2ZzVb0bq3s9Xc4m5n6o7p8q9r0s1t2u3
        type: string
    type: object
  handler.SetPasswordRequest:
    properties:
      new_password:
        description: At least 8 characters, at most 72 bytes.
        example: correct horse battery staple
        type: string
    type: object
  handler.SetupIntentResponse:
    properties:
      client_secret:
        description: |-
          Give it to Stripe.js (elements + confirmSetup). Single use; it lets the
          browser save ONE card for this company, nothing else.
        example: seti_1Qabc_secret_xyz
        type: string
      publishable_key:
        description: Public key of our Stripe account, for Stripe("pk_...").
        example: pk_test_51Qabc
        type: string
    type: object
  handler.SubscriptionItemResponse:
    properties:
      amount:
        description: unit_amount × quantity, in cents.
        example: 30000
        type: integer
      billing_unit:
        example: truck
        type: string
      id:
        format: uuid
        type: string
      nickname:
        example: Monthly
        type: string
      price_id:
        format: uuid
        type: string
      product_name:
        example: ELD Fleet plan
        type: string
      quantity:
        example: 12
        type: integer
      unit_amount:
        example: 2500
        type: integer
    type: object
  handler.SubscriptionResponse:
    properties:
      cancel_at_period_end:
        example: false
        type: boolean
      canceled_at:
        type: string
      company_id:
        format: uuid
        type: string
      created_at:
        example: "2026-10-07T11:26:26Z"
        type: string
      current_period_end:
        example: "2026-11-07T00:00:00Z"
        type: string
      current_period_start:
        example: "2026-10-07T00:00:00Z"
        type: string
      id:
        format: uuid
        type: string
      interval:
        example: month
        type: string
      items:
        items:
          $ref: '#/definitions/handler.SubscriptionItemResponse'
        type: array
      status:
        description: incomplete (not paid yet), active, past_due, unpaid, canceled,
          incomplete_expired, trialing, paused.
        example: active
        type: string
      stripe_subscription_id:
        example: sub_1QabcDEFghiJKL
        type: string
      total_amount:
        description: |-
          Sum of the items' amounts: what one interval costs, in cents (before
          proration, credits and tax).
        example: 40000
        type: integer
    type: object
  handler.SubscriptionStateResponse:
    properties:
      payment:
        allOf:
        - $ref: '#/definitions/handler.PaymentDueResponse'
        description: |-
          Present while the first invoice is unpaid: pay it in the browser,
          then POST .../subscription/refresh. null = nothing to pay now.
      subscription:
        $ref: '#/definitions/handler.SubscriptionResponse'
    type: object
  handler.TokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        description: Seconds until the access token expires.
        example: 900
        type: integer
      refresh_expires_in:
        description: Seconds until the refresh token (the session) expires.
        example: 2592000
        type: integer
      refresh_token:
        description: 'Single-use: exchange it at /api/v1/auth/refresh for a new pair.'
        example: q3Jx0yJ8Q0m1yG2ZzVb0bq3s9Xc4m5n6o7p8q9r0s1t
        type: string
      token_type:
        description: 'Always "Bearer": send the token as "Authorization: Bearer <access_token>".'
        example: Bearer
        type: string
    type: object
  handler.TruckResponse:
    properties:
      company_id:
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      id:
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      license_plate:
        example: ABC1234
        type: string
      make:
        example: Freightliner
        type: string
      model:
        example: Cascadia
        type: string
      plate_state:
        example: TX
        type: string
      unit_number:
        example: "101"
        type: string
      updated_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      vin:
        example: 1M8GDM9AXKP042788
        type: string
      year:
        example: 2022
        type: integer
    type: object
  handler.UpdateCompanyRequest:
    properties:
      dot_number:
        example: "1234567"
        type: string
      is_active:
        example: false
        type: boolean
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/New_York
        type: string
    type: object
  handler.UpdateDriverRequest:
    properties:
      license_expires_at:
        example: "2030-01-15"
        type: string
      license_number:
        example: D7654321
        type: string
      license_state:
        example: OK
        type: string
    type: object
  handler.UpdateELDDeviceRequest:
    properties:
      firmware_version:
        example: 2.0.0
        type: string
      is_active:
        example: false
        type: boolean
      model:
        example: PT30
        type: string
    type: object
  handler.UpdatePriceRequest:
    properties:
      is_active:
        description: false archives, true restores.
        example: false
        type: boolean
      nickname:
        example: Monthly (2026)
        type: string
    type: object
  handler.UpdateProductRequest:
    properties:
      description:
        example: Now with IFTA reports
        type: string
      is_active:
        description: false archives, true restores.
        example: true
        type: boolean
      name:
        example: ELD Fleet plan
        type: string
    type: object
  handler.UpdateRateLimitRequest:
    properties:
      limit:
        description: Maximum events per window, per key. 1-10000.
        example: 5
        type: integer
      window_seconds:
        description: Window length in seconds. 1-86400 (24 hours).
        example: 900
        type: integer
    type: object
  handler.UpdateTruckRequest:
    properties:
      is_active:
        example: false
        type: boolean
      license_plate:
        example: XYZ9876
        type: string
      make:
        example: Volvo
        type: string
      model:
        example: VNL 860
        type: string
      plate_state:
        example: OK
        type: string
      unit_number:
        example: 101A
        type: string
      year:
        example: 2023
        type: integer
    type: object
  handler.UpdateUserRequest:
    properties:
      first_name:
        example: Jane
        type: string
      is_active:
        example: false
        type: boolean
      last_name:
        example: Smith
        type: string
      roles:
        example:
        - dispatcher
        - manager
        items:
          type: string
        type: array
    type: object
  handler.UserResponse:
    properties:
      company_id:
        description: Null for platform users.
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      email:
        example: jane@acme.com
        type: string
      first_name:
        example: Jane
        type: string
      id:
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      last_login_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      last_name:
        example: Smith
        type: string
      roles:
        example:
        - dispatcher
        items:
          type: string
        type: array
      username:
        example: jane.smith
        type: string
    type: object
  handler.VerifyResetCodeRequest:
    properties:
      code:
        description: The 6-digit code from the email.
        example: "048213"
        type: string
      email:
        example: jane@acme.com
        type: string
    type: object
  handler.VerifyResetCodeResponse:
    properties:
      expires_in:
        description: Seconds until the reset token expires.
        example: 600
        type: integer
      reset_token:
        description: 'Single use: send it to /api/v1/auth/password/reset.'
        example: pX3k9Q0m1yG2ZzVb0bq3s9Xc4m5n6o7p8q9r0s1t2u3
        type: string
    type: object
info:
  contact: {}
  description: 'Backend for US motor carriers: companies, users, drivers, trucks and
    ELD devices.'
  title: ELD Fleet Management API
  version: "1.0"
paths:
  /api/v1/audit-logs:
    get:
      description: |-
        Requires permission: audit:read
        Who changed what and when, newest first. Company users see only their own company's records (company_id is ignored).
        For one record's history (e.g. a timeline in the UI), filter by entity and entity_id.
      parameters:
      - description: Entity type
        enum:
        - company
        - user
        - driver
        - truck
        - eld_device
        - rate_limit
        - product
        - price
        - subscription
        in: query
        name: entity
        type: string
      - description: ID of one record (with entity)
        in: query
        name: entity_id
        type: string
      - description: Exact action, e.g. truck.update
        in: query
        name: action
        type: string
      - description: Who made the change
        format: uuid
        in: query
        name: actor_id
        type: string
      - description: Platform users only
        format: uuid
        in: query
        name: company_id
        type: string
      - description: Changes at or after (RFC 3339)
        format: date-time
        in: query
        name: from
        type: string
      - description: Changes before (RFC 3339)
        format: date-time
        in: query
        name: to
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ListAuditLogsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission audit:read
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: List audit log entries
      tags:
      - audit
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges a login (email or username) and password for an access token and a refresh token.
        Unknown user and wrong password return the same 401 on purpose.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: invalid login or password
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many attempts (rate limits auth_requests or login_attempts,
            see /api/v1/rate-limits); see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: Log in
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        Ends the session of the given refresh token. Always 204, even for unknown tokens.
        The access token stays valid until it expires (max 15 minutes); clients should discard it.
      parameters:
      - description: Refresh token of the session to end
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests from this IP; see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: Log out
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user, their roles and effective permissions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MeResponse'
        "401":
          description: missing/invalid token, or the user no longer exists
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/password/forgot:
    post:
      consumes:
      - application/json
      description: |-
        Step 1 of 3. Emails a 6-digit code (valid 10 minutes, 5 attempts) if the address belongs to an active account.
        Always answers 202 with the same message, so it never reveals whether an account exists.
        Users without an email address (username-only drivers) must ask an administrator.
      parameters:
      - description: Account email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handler.ForgotPasswordResponse'
        "400":
          description: invalid JSON or email
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests (rate limits password_reset_requests or auth_requests);
            see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: 'Forgot password: email a code'
      tags:
      - auth
  /api/v1/auth/password/reset:
    post:
      consumes:
      - application/json
      description: Step 3 of 3. Sets the new password, ends every session of the user
        (log in again) and emails a notice.
      parameters:
      - description: Reset token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ResetPasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid JSON, weak new_password, or invalid_reset_token
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests from this IP; see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: 'Forgot password: set a new password'
      tags:
      - auth
  /api/v1/auth/password/verify:
    post:
      consumes:
      - application/json
      description: |-
        Step 2 of 3. Exchanges the emailed code for a single-use reset token (valid 10 minutes).
        Each wrong code uses one of the 5 attempts; then a new code must be requested.
      parameters:
      - description: Email and code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyResetCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.VerifyResetCodeResponse'
        "400":
          description: invalid JSON, or invalid_reset_code (wrong, expired or used
            up)
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests from this IP; see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: 'Forgot password: verify the code'
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges a refresh token for a new access + refresh token pair.
        The presented refresh token stops working (rotation). Presenting it again is treated as theft and ends all sessions of the user.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: invalid or expired refresh token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests from this IP; see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/billing/config:
    get:
      description: |-
        Login only. The Stripe publishable key the page needs to load Stripe.js (public by design).
        The route exists only when billing is enabled.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.BillingConfigResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Billing settings for the browser
      tags:
      - billing
  /api/v1/companies:
    get:
      description: |-
        Returns companies ordered by creation time. page_size is capped at 100.
        Platform users see all companies; company users see only their own.
        Requires permission: company:read
      parameters:
      - default: 1
        description: Page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ListCompaniesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission company:read
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: List companies
      tags:
      - companies
    post:
      consumes:
      - application/json
      description: |-
        Creates a motor carrier (tenant). New companies are active.
        Requires permission: company:create
      parameters:
      - description: Company to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateCompanyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created company
              type: string
          schema:
            $ref: '#/definitions/handler.CompanyResponse'
        "400":
          description: invalid JSON or validation failed
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission company:create
          schema:
            $ref: '#/definitions/apierror.Response'
        "409":
          description: DOT number already used
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Create a company
      tags:
      - companies
  /api/v1/companies/{id}:
    delete:
      description: |-
        Soft delete: the company is hidden but kept for history.
        Requires permission: company:delete
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission company:delete
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Delete a company
      tags:
      - companies
    get:
      description: 'Requires permission: company:read'
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CompanyResponse'
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission company:read
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Get a company
      tags:
      - companies
    patch:
      consumes:
      - application/json
      description: |-
        Partial update: only the fields present in the body are changed.
        Requires permission: company:update
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CompanyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission company:update
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "409":
          description: DOT number already used
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Update a company
      tags:
      - companies
  /api/v1/companies/{id}/billing/payment-methods:
    get:
      description: |-
        Requires permission: payment_method:manage. Company users: own company only.
        Only brand, last 4 digits and expiry: card numbers never reach this API.
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ListPaymentMethodsResponse'
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission payment_method:manage
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: company not found
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
        "502":
          description: Stripe refused the request or could not be reached
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: List saved cards
      tags:
      - billing
  /api/v1/companies/{id}/billing/payment-methods/{pm}:
    delete:
      description: 'Requires permission: payment_method:manage. The card is detached
        in Stripe and cannot be used again.'
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Payment method ID (pm_...)
        in: path
        name: pm
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission payment_method:manage
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: company or card not found (or the card is another company's)
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
        "502":
          description: Stripe refused the request or could not be reached
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Remove a card
      tags:
      - billing
  /api/v1/companies/{id}/billing/payment-methods/{pm}/default:
    put:
      description: 'Requires permission: payment_method:manage. The default card is
        charged for invoices.'
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Payment method ID (pm_...)
        in: path
        name: pm
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission payment_method:manage
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: company or card not found (or the card is another company's)
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
        "502":
          description: Stripe refused the request or could not be reached
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Make a card the default
      tags:
      - billing
  /api/v1/companies/{id}/billing/setup-intent:
    post:
      description: |-
        Requires permission: payment_method:manage. Company users: own company only.
        Returns a one-time client secret for Stripe.js: the browser sends the card straight to Stripe, never to this API.
        Creates the company's Stripe customer on first use.
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.SetupIntentResponse'
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission payment_method:manage
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: company not found
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
        "502":
          description: Stripe refused the request or could not be reached
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Start adding a card
      tags:
      - billing
  /api/v1/companies/{id}/billing/subscription:
    get:
      description: |-
        Requires permission: subscription:read. Company users: own company only.
        The subscription that has not ended (any status but canceled and incomplete_expired), as last synced from Stripe.
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SubscriptionResponse'
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission subscription:read
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: no current subscription (or company not found)
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: The company's current subscription
      tags:
      - billing
    post:
      consumes:
      - application/json
      description: |-
        Requires permission: subscription:manage. Company users: own company only.
        Starts the subscription as "incomplete" with an open first invoice; nothing is charged yet.
        Pay it in the browser with Stripe.js using payment.client_secret, then call .../subscription/refresh: the status becomes "active".
        Per-truck prices are billed for the company's active trucks; flat prices once. Needs a default card.
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Prices to subscribe to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateSubscriptionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.SubscriptionStateResponse'
        "400":
          description: 'validation failed: unknown/archived price, mixed intervals,
            no default card'
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission subscription:manage
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: company not found
          schema:
            $ref: '#/definitions/apierror.Response'
        "409":
          description: the company already has a subscription
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
