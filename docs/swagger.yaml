      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.PriceResponse'
        "400":
          description: invalid JSON, validation failed, or the product is archived
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission product:create, or not a platform user
          schema:
            $ref: '#/definitions/apierror.Response'
