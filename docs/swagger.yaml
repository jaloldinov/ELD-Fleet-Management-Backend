      consumes:
      - application/json
      description: |-
        Requires permission: user:set_password
        For users who cannot use "forgot password" (e.g. drivers without an email address) or are locked out.
        The user is logged out everywhere. Not for your own account, nor for disabled accounts (activate them first).
