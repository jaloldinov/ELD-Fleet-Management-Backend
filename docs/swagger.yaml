basePath: /
definitions:
  handler.CompanyResponse:
    properties:
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      dot_number:
        example: "1234567"
        type: string
      id:
        description: Company ID (UUIDv7, time-ordered).
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/Chicago
        type: string
      updated_at:
        example: "2026-10-02T11:26:26Z"
        type: string
    type: object
  handler.CreateCompanyRequest:
    properties:
      dot_number:
        example: "1234567"
        type: string
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/Chicago
        type: string
    type: object
  handler.CreateDriverRequest:
    properties:
      company_id:
        description: 'Platform users: required. Company users: omit (their own company
          is used).'
        format: uuid
        type: string
      email:
        description: Email and/or username. Drivers often have only a username.
        example: ""
        type: string
      first_name:
        example: Bob
        type: string
      last_name:
        example: Lee
        type: string
      license_expires_at:
        description: Calendar day, YYYY-MM-DD.
        example: "2028-05-31"
        type: string
      license_number:
        example: D1234567
        type: string
      license_state:
        description: Two-letter US state code.
        example: TX
        type: string
      password:
        example: correct horse battery staple
        type: string
      username:
        example: driver.bob
        type: string
    type: object
  handler.CreateUserRequest:
    properties:
      company_id:
        description: |-
          Platform users only: the company the new user belongs to (omit for a
          platform user). Company users may omit it; their own company is used.
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
        format: uuid
        type: string
      email:
        description: Email and/or username; at least one is required.
        example: jane@acme.com
        type: string
      first_name:
        example: Jane
        type: string
      last_name:
        example: Smith
        type: string
      password:
        description: 8 characters to 72 bytes.
        example: correct horse battery staple
        type: string
      roles:
        example:
        - dispatcher
        items:
          type: string
        type: array
      username:
        example: jane.smith
        type: string
    type: object
  handler.DriverResponse:
    properties:
      company_id:
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      email:
        example: bob@acme.com
        type: string
      first_name:
        example: Bob
        type: string
      id:
        format: uuid
        type: string
      is_active:
        description: 'Follows the user account: a deactivated user is an inactive
          driver.'
        example: true
        type: boolean
      last_name:
        example: Lee
        type: string
      license_expires_at:
        example: "2028-05-31"
        type: string
      license_number:
        example: D1234567
        type: string
      license_state:
        example: TX
        type: string
      user_id:
        format: uuid
        type: string
      username:
        example: driver.bob
        type: string
    type: object
  handler.ErrorBody:
    properties:
      code:
        example: validation_failed
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      message:
        example: request validation failed
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/handler.ErrorBody'
    type: object
  handler.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  handler.ListCompaniesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.CompanyResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 57
        type: integer
    type: object
  handler.ListDriversResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.DriverResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 8
        type: integer
    type: object
  handler.ListUsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.UserResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 12
        type: integer
    type: object
  handler.LoginRequest:
    properties:
      login:
        description: Email or username.
        example: admin@example.com
        type: string
      password:
        example: correct horse battery staple
        type: string
    type: object
  handler.MeResponse:
    properties:
      company_id:
        description: Null for platform users.
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      email:
        example: jane@acme.com
        type: string
      first_name:
        example: Jane
        type: string
      id:
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      last_login_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      last_name:
        example: Smith
        type: string
      permissions:
        example:
        - truck:read
        - driver:read
        items:
          type: string
        type: array
      roles:
        example:
        - dispatcher
        items:
          type: string
        type: array
      username:
        example: jane.smith
        type: string
    type: object
  handler.ReadyResponse:
    properties:
      database:
        example: up
        type: string
      status:
        example: ok
        type: string
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        example: q3Jx0yJ8Q0m1yG2ZzVb0bq3s9Xc4m5n6o7p8q9r0s1t
        type: string
    type: object
  handler.TokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        description: Seconds until the access token expires.
        example: 900
        type: integer
      refresh_expires_in:
        description: Seconds until the refresh token (the session) expires.
        example: 2592000
        type: integer
      refresh_token:
        description: 'Single-use: exchange it at /api/v1/auth/refresh for a new pair.'
        example: q3Jx0yJ8Q0m1yG2ZzVb0bq3s9Xc4m5n6o7p8q9r0s1t
        type: string
      token_type:
        description: 'Always "Bearer": send the token as "Authorization: Bearer <access_token>".'
        example: Bearer
        type: string
    type: object
  handler.UpdateCompanyRequest:
    properties:
      dot_number:
        example: "1234567"
        type: string
      is_active:
        example: false
        type: boolean
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/New_York
        type: string
    type: object
  handler.UpdateDriverRequest:
    properties:
      license_expires_at:
        example: "2030-01-15"
        type: string
      license_number:
        example: D7654321
        type: string
      license_state:
        example: OK
        type: string
    type: object
  handler.UpdateUserRequest:
    properties:
      first_name:
        example: Jane
        type: string
      is_active:
        example: false
        type: boolean
      last_name:
        example: Smith
        type: string
      roles:
        example:
        - dispatcher
        - manager
        items:
          type: string
        type: array
    type: object
  handler.UserResponse:
    properties:
      company_id:
        description: Null for platform users.
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      email:
        example: jane@acme.com
        type: string
      first_name:
        example: Jane
        type: string
      id:
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      last_login_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      last_name:
        example: Smith
        type: string
      roles:
        example:
        - dispatcher
        items:
          type: string
        type: array
      username:
        example: jane.smith
        type: string
    type: object
info:
  contact: {}
  description: 'Backend for US motor carriers: companies, users, drivers, trucks and
    ELD devices.'
  title: ELD Fleet Management API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges a login (email or username) and password for an access token and a refresh token.
        Unknown user and wrong password return the same 401 on purpose.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: invalid login or password
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        Ends the session of the given refresh token. Always 204, even for unknown tokens.
        The access token stays valid until it expires (max 15 minutes); clients should discard it.
      parameters:
      - description: Refresh token of the session to end
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Log out
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user, their roles and effective permissions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MeResponse'
        "401":
          description: missing/invalid token, or the user no longer exists
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges a refresh token for a new access + refresh token pair.
        The presented refresh token stops working (rotation). Presenting it again is treated as theft and ends all sessions of the user.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: invalid or expired refresh token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/companies:
    get:
      description: |-
        Returns companies ordered by creation time. page_size is capped at 100.
        Platform users see all companies; company users see only their own.
        Requires permission: company:read
      parameters:
      - default: 1
        description: Page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ListCompaniesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission company:read
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List companies
      tags:
      - companies
    post:
      consumes:
      - application/json
      description: |-
        Creates a motor carrier (tenant). New companies are active.
        Requires permission: company:create
      parameters:
      - description: Company to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateCompanyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the created company
              type: string
          schema:
            $ref: '#/definitions/handler.CompanyResponse'
        "400":
          description: invalid JSON or validation failed
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission company:create
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: DOT number already used
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a company
      tags:
      - companies
  /api/v1/companies/{id}:
    delete:
      description: |-
        Soft delete: the company is hidden but kept for history.
        Requires permission: company:delete
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission company:delete
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a company
      tags:
      - companies
    get:
      description: 'Requires permission: company:read'
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CompanyResponse'
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission company:read
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a company
      tags:
      - companies
    patch:
      consumes:
      - application/json
      description: |-
        Partial update: only the fields present in the body are changed.
        Requires permission: company:update
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CompanyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission company:update
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: DOT number already used
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a company
      tags:
      - companies
  /api/v1/drivers:
    get:
      description: |-
        Requires permission: driver:read
        Company users always get their own company's drivers (company_id is ignored).
      parameters:
      - description: Filter by company (platform users only)
        format: uuid
        in: query
        name: company_id
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ListDriversResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission driver:read
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List drivers
      tags:
      - drivers
    post:
      consumes:
      - application/json
      description: |-
        Requires permission: driver:create
        Creates the driver's user account (role "driver") and driver profile in one transaction.
      parameters:
      - description: Driver to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateDriverRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.DriverResponse'
        "400":
          description: invalid JSON or validation failed
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission driver:create
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: company not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: login or license already used
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a driver
      tags:
      - drivers
  /api/v1/drivers/{id}:
    delete:
      description: |-
        Requires permission: driver:delete
        Soft-deletes the driver profile and the driver's user account; all sessions end.
      parameters:
      - description: Driver ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission driver:delete
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a driver
      tags:
      - drivers
    get:
      description: 'Requires permission: driver:read'
      parameters:
      - description: Driver ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.DriverResponse'
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission driver:read
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a driver
      tags:
      - drivers
    patch:
      consumes:
      - application/json
      description: |-
        Requires permission: driver:update
        License fields only. Names and active status: PATCH /api/v1/users/{user_id}.
      parameters:
      - description: Driver ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateDriverRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.DriverResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission driver:update
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: license already used
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a driver's license
      tags:
      - drivers
  /api/v1/drivers/me:
    get:
      description: 'For the driver app: the caller''s own driver profile. Needs a
        login, no extra permission.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.DriverResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: the caller is not a driver
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: My driver profile
      tags:
      - drivers
  /api/v1/users:
    get:
      description: |-
        Requires permission: user:read
        Company users always get their own company's users (company_id is ignored).
      parameters:
      - description: Filter by company (platform users only)
        format: uuid
        in: query
        name: company_id
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ListUsersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission user:read
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: |-
        Requires permission: user:create
        Company users create users only in their own company, with company roles.
      parameters:
      - description: User to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: invalid JSON or validation failed
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission user:create
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: company not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: email or username already used
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a user
      tags:
      - users
  /api/v1/users/{id}:
    delete:
      description: |-
        Requires permission: user:delete
        Soft delete; all of the user's sessions end. You cannot delete yourself.
      parameters:
      - description: User ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission user:delete, or deleting yourself
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - users
    get:
      description: 'Requires permission: user:read'
      parameters:
      - description: User ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: invalid id
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission user:read
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a user
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        Requires permission: user:update
        Partial update. roles replaces all roles. Deactivating a user ends all their sessions.
        Nobody can change their own roles or active status.
      parameters:
      - description: User ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: missing permission user:update, or changing your own roles/status
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a user
      tags:
      - users
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Liveness check
      tags:
      - health
  /ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ReadyResponse'
      summary: Readiness check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: 'Access token from /api/v1/auth/login. Enter: Bearer <access_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
