basePath: /
definitions:
  apierror.Body:
    properties:
      code:
        example: validation_failed
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      message:
        example: request validation failed
        type: string
    type: object
  apierror.Response:
    properties:
      error:
        $ref: '#/definitions/apierror.Body'
    type: object
  handler.AddCreditRequest:
    properties:
      amount:
        example: 2500
        type: integer
      description:
        example: Service outage on 3 Oct
        type: string
    type: object
  handler.AssignDriverRequest:
    properties:
      role:
        description: Omit for primary. A truck has at most one of each.
        enum:
        - primary
        - co_driver
        example: primary
        type: string
      truck_id:
        format: uuid
        type: string
    type: object
  handler.AssignTruckRequest:
    properties:
      replace:
        description: |-
          true: if the truck already has another device, take it out (e.g. it
          broke and this one replaces it). false/omitted: 409 in that case.
        example: false
        type: boolean
      truck_id:
        format: uuid
        type: string
    type: object
  handler.AuditActor:
    properties:
      id:
        format: uuid
        type: string
      name:
        example: Jane Smith
        type: string
    type: object
  handler.AuditChangeResponse:
    properties:
      new: {}
      old: {}
    type: object
  handler.AuditLogResponse:
    properties:
      action:
        example: truck.update
        type: string
      actor:
        allOf:
        - $ref: '#/definitions/handler.AuditActor'
        description: null = the system itself (e.g. the createadmin CLI).
      changes:
        additionalProperties:
          $ref: '#/definitions/handler.AuditChangeResponse'
        description: |-
          Only the fields that changed: {"unit_number": {"old": "101", "new": "101A"}}.
          null for actions without values (delete, password changes).
        type: object
      company_id:
        format: uuid
        type: string
      entity:
        example: truck
        type: string
      entity_id:
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        type: string
      id:
        format: uuid
        type: string
      occurred_at:
        example: "2026-10-03T11:26:26Z"
        type: string
      request_id:
        example: 9c1a1ea6-d4cb-4085-a373-493ea2077a6c
        type: string
    type: object
  handler.BalanceResponse:
    properties:
      balance:
        description: Cents. Negative = credit the company has (pays its next invoices).
        example: -2500
        type: integer
      transactions:
        items:
          $ref: '#/definitions/handler.BalanceTransactionResponse'
        type: array
    type: object
  handler.BalanceTransactionResponse:
    properties:
      amount:
        description: Cents; negative = credit added.
        example: -2500
        type: integer
      created_at:
        example: "2026-10-07T11:26:26Z"
        type: string
      description:
        example: Service outage on 3 Oct
        type: string
      ending_balance:
        example: -2500
        type: integer
      id:
        example: cbtxn_1Qabc
        type: string
      stripe_invoice_id:
        example: in_1Qabc
        type: string
      type:
        description: adjustment (credit given), applied_to_invoice, credit_note, ...
        example: adjustment
        type: string
    type: object
  handler.BillingConfigResponse:
    properties:
      publishable_key:
        description: Public key of our Stripe account, for Stripe("pk_...").
        example: pk_test_51Qabc
        type: string
    type: object
  handler.BillingMetricsResponse:
    properties:
      arr:
        example: 3000000
        type: integer
      companies_by_billing_status:
        additionalProperties:
          type: integer
        description: 'Companies by billing status: none, pending, active, past_due,
          blocked.'
        type: object
      currency:
        example: usd
        type: string
      months:
        description: Oldest first; every month present.
        items:
          $ref: '#/definitions/handler.MonthMetricsResponse'
        type: array
      mrr:
        description: |-
          Monthly recurring revenue in cents: active and past_due subscriptions,
          yearly prices counted as 1/12. Discounts and credit are not subtracted.
        example: 250000
        type: integer
      mrr_by_product:
        items:
          $ref: '#/definitions/handler.ProductMRRResponse'
        type: array
      outstanding:
        $ref: '#/definitions/handler.OutstandingResponse'
      payment_failures_30d:
        description: Failed payment attempts Stripe reported in the last 30 days (retries
          count).
        example: 3
        type: integer
      subscriptions_by_status:
        additionalProperties:
          type: integer
        description: All subscriptions (ended ones too) by status.
        type: object
    type: object
  handler.BoardTruckResponse:
    properties:
      id:
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      unit_number:
        example: "101"
        type: string
    type: object
  handler.CancelSubscriptionRequest:
    properties:
      at_period_end:
        description: |-
          true (default): keep the service until the end of the paid period.
          false: end now, unused time becomes credit (platform only).
        example: true
        type: boolean
    type: object
  handler.CertificationResponse:
    properties:
      certified:
        type: boolean
      certified_at:
        description: the latest signature; null = never
        type: string
      last_change_at:
        description: null = no records
        type: string
    type: object
  handler.ChangeDutyStatusRequest:
    properties:
      note:
        example: pre-trip inspection
        maxLength: 500
        type: string
      special:
        description: |-
          personal_conveyance only with off_duty, yard_moves only with on_duty;
          both need a truck.
        enum:
        - personal_conveyance
        - yard_moves
        type: string
      status:
        description: 'driving is not accepted: the ELD records it from the truck''s
          movement.'
        enum:
        - off_duty
        - sleeper_berth
        - on_duty
        example: on_duty
        type: string
    type: object
  handler.ChangeSubscriptionRequest:
    properties:
      price_ids:
        description: 'The WHOLE new plan: every price wanted after the change. Left
          out = removed.'
        example:
        - 0199a1b2-0000-7000-8000-0000000000b1
        items:
          type: string
        type: array
      proration_date:
        description: 'From the preview: charges exactly what it showed. Omit to use
          "now".'
        example: 1791331200
        type: integer
    type: object
  handler.ChargeResponse:
    properties:
      invoice:
        $ref: '#/definitions/handler.InvoiceResponse'
      payment_error:
        description: |-
          Why charging now failed (the bank's words); the invoice stays open
          and Stripe retries it. Empty = paid (or not charged now).
        example: Your card has insufficient funds.
        type: string
    type: object
  handler.CompanyResponse:
    properties:
      billing_status:
        description: |-
          Follows the subscription: none, pending (first invoice unpaid), active,
          past_due (payment failed, grace period), blocked. Fleet routes need
          active or past_due when billing is enabled.
        example: active
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      dot_number:
        example: "1234567"
        type: string
      hos_cycle:
        description: 'Hours-of-service cycle: us_70_8 (70 hours in 8 days) or us_60_7.'
        enum:
        - us_70_8
        - us_60_7
        example: us_70_8
        type: string
      id:
        description: Company ID (UUIDv7, time-ordered).
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/Chicago
        type: string
      updated_at:
        example: "2026-10-02T11:26:26Z"
        type: string
    type: object
  handler.CreateChargeRequest:
    properties:
      amount:
        example: 15000
        type: integer
      charge_now:
        description: 'true: charge the default card now. false: Stripe collects it
          on its own schedule.'
        example: true
        type: boolean
      description:
        description: What the company sees on the invoice.
        example: ELD installation, 3 trucks
        type: string
    type: object
  handler.CreateCompanyRequest:
    properties:
      dot_number:
        example: "1234567"
        type: string
      hos_cycle:
        description: 'Hours-of-service cycle: 70 hours in 8 days (default) or 60 in
          7.'
        enum:
        - us_70_8
        - us_60_7
        example: us_70_8
        type: string
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/Chicago
        type: string
    type: object
  handler.CreateCreditNoteRequest:
    properties:
      amount:
        example: 5000
        type: integer
      memo:
        example: Two trucks were billed twice
        type: string
      reason:
        description: duplicate, fraudulent, order_change, product_unsatisfactory
        example: order_change
        type: string
      refund:
        description: 'Paid invoice: true = refund to the card; false = credit to the
          balance.'
        example: true
        type: boolean
    type: object
  handler.CreateDriverRequest:
    properties:
      company_id:
        description: 'Platform users: required. Company users: omit (their own company
          is used).'
        format: uuid
        type: string
      email:
        description: Email and/or username. Drivers often have only a username.
        example: ""
        type: string
      first_name:
        example: Bob
        type: string
      last_name:
        example: Lee
        type: string
      license_expires_at:
        description: Calendar day, YYYY-MM-DD.
        example: "2028-05-31"
        type: string
      license_number:
        example: D1234567
        type: string
      license_state:
        description: Two-letter US state code.
        example: TX
        type: string
      password:
        example: correct horse battery staple
        type: string
      username:
        example: driver.bob
        type: string
    type: object
  handler.CreateELDDeviceRequest:
    properties:
      company_id:
        description: 'Platform users: required. Company users: omit (their own company
          is used).'
        format: uuid
        type: string
      firmware_version:
        example: 1.2.3
        type: string
      model:
        example: PT30
        type: string
      serial_number:
        description: Hardware serial, 4-32 letters/digits/hyphens. Cannot be changed
          later.
        example: PT30-0001
        type: string
    type: object
  handler.CreatePriceRequest:
    properties:
      billing_unit:
        description: company = flat amount per company; truck = per active truck.
          Never changes later.
        enum:
        - company
        - truck
        example: truck
        type: string
      interval:
        description: month or year. Never changes later.
        enum:
        - month
        - year
        example: month
        type: string
      nickname:
        example: Monthly
        type: string
      unit_amount:
        description: 'Amount in cents: 2500 = $25.00. 0 to 99999999. Never changes
          later.'
        example: 2500
        type: integer
    type: object
  handler.CreateProductRequest:
    properties:
      description:
        example: Hours of service and DVIR for every truck
        type: string
      name:
        example: ELD Fleet plan
        type: string
    type: object
  handler.CreateSubscriptionRequest:
    properties:
      price_ids:
        description: One price per product, all with the same interval (all monthly
          or all yearly).
        example:
        - 0199a1b2-0000-7000-8000-0000000000b1
        items:
          type: string
        type: array
    type: object
  handler.CreateTruckRequest:
    properties:
      company_id:
        description: 'Platform users: required. Company users: omit (their own company
          is used).'
        format: uuid
        type: string
      license_plate:
        example: ABC1234
        type: string
      make:
        example: Freightliner
        type: string
      model:
        example: Cascadia
        type: string
      plate_state:
        example: TX
        type: string
      unit_number:
        description: The carrier's own truck number.
        example: "101"
        type: string
      vin:
        description: 17 characters; the check digit is validated. Cannot be changed
          later.
        example: 1M8GDM9AXKP042788
        type: string
      year:
        example: 2022
        type: integer
    type: object
  handler.CreateUserRequest:
    properties:
      company_id:
        description: |-
          Platform users only: the company the new user belongs to (omit for a
          platform user). Company users may omit it; their own company is used.
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
        format: uuid
        type: string
      email:
        description: Email and/or username; at least one is required.
        example: jane@acme.com
        type: string
      first_name:
        example: Jane
        type: string
      last_name:
        example: Smith
        type: string
      password:
        description: 8 characters to 72 bytes.
        example: correct horse battery staple
        type: string
      roles:
        example:
        - dispatcher
        items:
          type: string
        type: array
      username:
        example: jane.smith
        type: string
    type: object
  handler.CreditNoteResponse:
    properties:
      amount:
        example: 5000
        type: integer
      created_at:
        example: "2026-10-07T11:26:26Z"
        type: string
      credit_amount:
        example: 0
        type: integer
      id:
        example: cn_1Qabc
        type: string
      memo:
        example: Two trucks were billed twice
        type: string
      number:
        example: ABCD-0001-CN-01
        type: string
      reason:
        example: order_change
        type: string
      refund_amount:
        example: 5000
        type: integer
    type: object
  handler.CrewMemberResponse:
    properties:
      assignment_id:
        format: uuid
        type: string
      driver_id:
        format: uuid
        type: string
      first_name:
        example: Ali
        type: string
      last_name:
        example: Valiyev
        type: string
      role:
        enum:
        - primary
        - co_driver
        example: primary
        type: string
      since:
        example: "2026-11-07T08:00:00Z"
        type: string
    type: object
  handler.DailyLogResponse:
    properties:
      certification:
        $ref: '#/definitions/handler.CertificationResponse'
      date:
        example: "2026-11-10"
        type: string
      driver_id:
        format: uuid
        type: string
      ends_at:
        example: "2026-11-11T00:00:00-06:00"
        type: string
      history:
        description: Records of the day that edits replaced, oldest first.
        items:
          $ref: '#/definitions/handler.DutyStatusEventResponse'
        type: array
      recorded_until:
        description: 'The log is known up to here: ends_at for a past day, now for
          today.'
        example: "2026-11-11T00:00:00-06:00"
        type: string
      segments:
        items:
          $ref: '#/definitions/handler.DutySegmentResponse'
        type: array
      starts_at:
        example: "2026-11-10T00:00:00-06:00"
        type: string
      timezone:
        example: America/Chicago
        type: string
      totals:
        $ref: '#/definitions/handler.DutyTotalsResponse'
      unrecorded_seconds:
        description: Before the driver's first record ever (a new driver).
        example: 0
        type: integer
    type: object
  handler.DeviceSelfResponse:
    properties:
      company_id:
        format: uuid
        type: string
      device_id:
        format: uuid
        type: string
      installed_at:
        description: |-
          When it was installed in that truck: readings recorded earlier
          belong to no truck (the device was not in it yet).
        example: "2026-11-08T07:30:00Z"
        type: string
      serial_number:
        example: PT30-0001
        type: string
      status:
        enum:
        - active
        - faulty
        - retired
        example: active
        type: string
      truck:
        allOf:
        - $ref: '#/definitions/handler.BoardTruckResponse'
        description: null = not installed
    type: object
  handler.DeviceStateResponse:
    properties:
      clock_checked_at:
        example: "2026-11-08T14:31:00Z"
        type: string
      clock_offset_seconds:
        description: |-
          How far the device's clock is from ours (positive = fast), from the
          last batch that carried sent_at; null = never measured. FMCSA allows
          10 minutes (600 s); readings beyond that are refused.
        example: -2.5
        type: number
      connection:
        enum:
        - online
        - offline
        - never
        example: online
        type: string
      device_id:
        format: uuid
        type: string
      last_seen_at:
        example: "2026-11-08T14:31:00Z"
        type: string
      position:
        allOf:
        - $ref: '#/definitions/handler.PositionResponse'
        description: null = no reading yet
      truck_id:
        description: installed in now
        format: uuid
        type: string
    type: object
  handler.DriverAssignmentRecordResponse:
    properties:
      company_id:
        format: uuid
        type: string
      driver_first_name:
        example: Ali
        type: string
      driver_id:
        format: uuid
        type: string
      driver_last_name:
        example: Valiyev
        type: string
      ended_at:
        description: null = current
        example: "2026-11-07T17:30:00Z"
        type: string
      ended_by:
        format: uuid
        type: string
      id:
        format: uuid
        type: string
      role:
        enum:
        - primary
        - co_driver
        example: primary
        type: string
      started_at:
        example: "2026-11-07T08:00:00Z"
        type: string
      started_by:
        description: null = the system
        format: uuid
        type: string
      truck_id:
        format: uuid
        type: string
      truck_unit_number:
        example: "101"
        type: string
    type: object
  handler.DriverAssignmentResponse:
    properties:
      company_id:
        format: uuid
        type: string
      driver_id:
        format: uuid
        type: string
      ended_at:
        description: null = current
        example: "2026-11-07T17:30:00Z"
        type: string
      ended_by:
        format: uuid
        type: string
      id:
        format: uuid
        type: string
      role:
        enum:
        - primary
        - co_driver
        example: primary
        type: string
      started_at:
        example: "2026-11-07T08:00:00Z"
        type: string
      started_by:
        description: null = the system
        format: uuid
        type: string
      truck_id:
        format: uuid
        type: string
    type: object
  handler.DriverResponse:
    properties:
      company_id:
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      dispatcher_id:
        description: The user who dispatches this driver; null = nobody.
        format: uuid
        type: string
      email:
        example: bob@acme.com
        type: string
      first_name:
        example: Bob
        type: string
      id:
        format: uuid
        type: string
      is_active:
        description: 'Follows the user account: a deactivated user is an inactive
          driver.'
        example: true
        type: boolean
      last_name:
        example: Lee
        type: string
      license_expires_at:
        example: "2028-05-31"
        type: string
      license_number:
        example: D1234567
        type: string
      license_state:
        example: TX
        type: string
      user_id:
        format: uuid
        type: string
      username:
        example: driver.bob
        type: string
    type: object
  handler.DriverTruckResponse:
    properties:
      driver_id:
        format: uuid
        type: string
      role:
        enum:
        - primary
        - co_driver
        example: primary
        type: string
      since:
        example: "2026-11-07T08:00:00Z"
        type: string
      truck:
        $ref: '#/definitions/handler.TruckBoardResponse'
    type: object
  handler.DutyRecordRequest:
    properties:
      note:
        maxLength: 500
        type: string
      reason:
        description: 'Why the log is being fixed: 4 to 60 characters, required.'
        example: forgot to press off duty
        maxLength: 60
        minLength: 4
        type: string
      special:
        enum:
        - personal_conveyance
        - yard_moves
        type: string
      started_at:
        example: "2026-11-10T16:00:00-06:00"
        type: string
      status:
        description: 'driving is not accepted: the ELD records it.'
        enum:
        - off_duty
        - sleeper_berth
        - on_duty
        example: off_duty
        type: string
    type: object
  handler.DutySegmentResponse:
    properties:
      duration_seconds:
        example: 3600
        type: integer
      ended_at:
        example: "2026-11-10T07:00:00-06:00"
        type: string
      record:
        $ref: '#/definitions/handler.DutyStatusEventResponse'
      started_at:
        example: "2026-11-10T06:00:00-06:00"
        type: string
    type: object
  handler.DutyStatusEventResponse:
    properties:
      created_at:
        type: string
      driver_id:
        format: uuid
        type: string
      edit_reason:
        example: forgot to press off duty
        type: string
      engine_hours:
        example: 8012.3
        type: number
      id:
        format: uuid
        type: string
      inactivated_at:
        description: 'On a replaced record: when the edit took it out.'
        type: string
      latitude:
        example: 32.7767
        type: number
      longitude:
        example: -96.797
        type: number
      note:
        type: string
      odometer_mi:
        example: 120500.5
        type: number
      origin:
        enum:
        - auto
        - driver
        example: driver
        type: string
      record_status:
        description: active = part of the log; inactive = replaced by an edit (history).
        enum:
        - active
        - inactive
        example: active
        type: string
      replaces:
        description: 'On an edit: the record it replaced. On an edit or an added record:
          why.'
        format: uuid
        type: string
      special:
        enum:
        - personal_conveyance
        - yard_moves
        type: string
      started_at:
        example: "2026-11-11T06:00:00Z"
        type: string
      status:
        enum:
        - off_duty
        - sleeper_berth
        - driving
        - on_duty
        example: on_duty
        type: string
      truck_id:
        format: uuid
        type: string
    type: object
  handler.DutyTotalsResponse:
    properties:
      driving:
        example: 28800
        type: integer
      off_duty:
        example: 50400
        type: integer
      on_duty:
        example: 7200
        type: integer
      sleeper_berth:
        example: 0
        type: integer
    type: object
  handler.ELDAssignmentResponse:
    properties:
      company_id:
        format: uuid
        type: string
      eld_device_id:
        format: uuid
        type: string
      ended_at:
        description: null = still installed
        example: "2026-11-09T16:00:00Z"
        type: string
      ended_by:
        format: uuid
        type: string
      id:
        format: uuid
        type: string
      serial_number:
        example: PT30-0001
        type: string
      started_at:
        example: "2026-11-07T07:30:00Z"
        type: string
      started_by:
        format: uuid
        type: string
      truck_id:
        format: uuid
        type: string
      truck_unit_number:
        example: "101"
        type: string
    type: object
  handler.ELDDeviceResponse:
    properties:
      company_id:
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      firmware_version:
        example: 1.2.3
        type: string
      has_key:
        description: |-
          The device's API key (never the key itself): has_key = the device can
          call the API; when the key was issued.
        example: true
        type: boolean
      id:
        format: uuid
        type: string
      is_active:
        description: status is active
