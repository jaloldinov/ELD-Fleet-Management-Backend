    post:
      description: 'For ELD devices with nothing new to report (parked, engine off):
        keeps the device "online". Any authenticated device request counts as contact;
        this one does nothing else. Authorization: Device <key>.'
      responses:
        "204":
          description: no content
        "401":
          description: missing, unknown or revoked device key
          schema:
            $ref: '#/definitions/apierror.Response'
