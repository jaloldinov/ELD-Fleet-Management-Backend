basePath: /
definitions:
  apierror.Body:
    properties:
      code:
        example: validation_failed
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      message:
        example: request validation failed
        type: string
    type: object
  apierror.Response:
    properties:
      error:
        $ref: '#/definitions/apierror.Body'
    type: object
  handler.AssignTruckRequest:
    properties:
      truck_id:
        format: uuid
        type: string
    type: object
  handler.CompanyResponse:
    properties:
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      dot_number:
        example: "1234567"
        type: string
      id:
        description: Company ID (UUIDv7, time-ordered).
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/Chicago
        type: string
      updated_at:
        example: "2026-10-02T11:26:26Z"
        type: string
    type: object
  handler.CreateCompanyRequest:
    properties:
      dot_number:
        example: "1234567"
        type: string
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/Chicago
        type: string
    type: object
  handler.CreateDriverRequest:
    properties:
      company_id:
        description: 'Platform users: required. Company users: omit (their own company
          is used).'
        format: uuid
        type: string
      email:
        description: Email and/or username. Drivers often have only a username.
        example: ""
        type: string
      first_name:
        example: Bob
        type: string
      last_name:
        example: Lee
        type: string
      license_expires_at:
        description: Calendar day, YYYY-MM-DD.
        example: "2028-05-31"
        type: string
      license_number:
        example: D1234567
        type: string
      license_state:
        description: Two-letter US state code.
        example: TX
        type: string
      password:
        example: correct horse battery staple
        type: string
      username:
        example: driver.bob
        type: string
    type: object
  handler.CreateELDDeviceRequest:
    properties:
      company_id:
        description: 'Platform users: required. Company users: omit (their own company
          is used).'
        format: uuid
        type: string
      firmware_version:
        example: 1.2.3
        type: string
      model:
        example: PT30
        type: string
      serial_number:
        description: Hardware serial, 4-32 letters/digits/hyphens. Cannot be changed
          later.
        example: PT30-0001
        type: string
    type: object
  handler.CreateTruckRequest:
    properties:
      company_id:
        description: 'Platform users: required. Company users: omit (their own company
          is used).'
        format: uuid
        type: string
      license_plate:
        example: ABC1234
        type: string
      make:
        example: Freightliner
        type: string
      model:
        example: Cascadia
        type: string
      plate_state:
        example: TX
        type: string
      unit_number:
        description: The carrier's own truck number.
        example: "101"
        type: string
      vin:
        description: 17 characters; the check digit is validated. Cannot be changed
          later.
        example: 1M8GDM9AXKP042788
        type: string
      year:
        example: 2022
        type: integer
    type: object
  handler.CreateUserRequest:
    properties:
      company_id:
        description: |-
          Platform users only: the company the new user belongs to (omit for a
          platform user). Company users may omit it; their own company is used.
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
        format: uuid
        type: string
      email:
        description: Email and/or username; at least one is required.
        example: jane@acme.com
        type: string
      first_name:
        example: Jane
        type: string
      last_name:
        example: Smith
        type: string
      password:
        description: 8 characters to 72 bytes.
        example: correct horse battery staple
        type: string
      roles:
        example:
        - dispatcher
        items:
          type: string
        type: array
      username:
        example: jane.smith
        type: string
    type: object
  handler.DriverResponse:
    properties:
      company_id:
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      email:
        example: bob@acme.com
        type: string
      first_name:
        example: Bob
        type: string
      id:
        format: uuid
        type: string
      is_active:
        description: 'Follows the user account: a deactivated user is an inactive
          driver.'
        example: true
        type: boolean
      last_name:
        example: Lee
        type: string
      license_expires_at:
        example: "2028-05-31"
        type: string
      license_number:
        example: D1234567
        type: string
      license_state:
        example: TX
        type: string
      user_id:
        format: uuid
        type: string
      username:
        example: driver.bob
        type: string
    type: object
  handler.ELDDeviceResponse:
    properties:
      company_id:
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      firmware_version:
        example: 1.2.3
        type: string
      id:
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      model:
        example: PT30
        type: string
      serial_number:
        example: PT30-0001
        type: string
      truck_id:
        description: null = not installed
        format: uuid
        type: string
      updated_at:
        example: "2026-10-02T11:26:26Z"
        type: string
    type: object
  handler.ForgotPasswordRequest:
    properties:
      email:
        example: jane@acme.com
        type: string
    type: object
  handler.ForgotPasswordResponse:
    properties:
      message:
        example: If an account with this email exists, a reset code has been sent.
        type: string
    type: object
  handler.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  handler.ListCompaniesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.CompanyResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 57
        type: integer
    type: object
  handler.ListDriversResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.DriverResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 8
        type: integer
    type: object
  handler.ListELDDevicesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.ELDDeviceResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 14
        type: integer
    type: object
  handler.ListRateLimitsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.RateLimitResponse'
        type: array
    type: object
  handler.ListTrucksResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.TruckResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 14
        type: integer
    type: object
  handler.ListUsersResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.UserResponse'
        type: array
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 12
        type: integer
    type: object
  handler.LoginRequest:
    properties:
      login:
        description: Email or username.
        example: admin@example.com
        type: string
      password:
        example: correct horse battery staple
        type: string
    type: object
  handler.MeResponse:
    properties:
      company_id:
        description: Null for platform users.
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      email:
        example: jane@acme.com
        type: string
      first_name:
        example: Jane
        type: string
      id:
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      last_login_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      last_name:
        example: Smith
        type: string
      permissions:
        example:
        - truck:read
        - driver:read
        items:
          type: string
        type: array
      roles:
        example:
        - dispatcher
        items:
          type: string
        type: array
      username:
        example: jane.smith
        type: string
    type: object
  handler.RateLimitResponse:
    properties:
      description:
        example: Login attempts per login name + client IP; a successful login resets
          it
        type: string
      limit:
        example: 5
        type: integer
      name:
        description: |-
          auth_requests: per client IP, all /api/v1/auth/* routes.
          login_attempts: per login name + client IP, POST /api/v1/auth/login.
        example: login_attempts
        type: string
      updated_at:
        example: "2026-10-03T11:26:26Z"
        type: string
      updated_by:
        format: uuid
        type: string
      window_seconds:
        example: 900
        type: integer
    type: object
  handler.ReadyResponse:
    properties:
      database:
        example: up
        type: string
      status:
        example: ok
        type: string
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        example: q3Jx0yJ8Q0m1yG2ZzVb0bq3s9Xc4m5n6o7p8q9r0s1t
        type: string
    type: object
  handler.ResetPasswordRequest:
    properties:
      new_password:
        example: correct horse battery staple
        type: string
      reset_token:
        example: pX3k9Q0m1yG2ZzVb0bq3s9Xc4m5n6o7p8q9r0s1t2u3
        type: string
    type: object
  handler.TokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        description: Seconds until the access token expires.
        example: 900
        type: integer
      refresh_expires_in:
        description: Seconds until the refresh token (the session) expires.
        example: 2592000
        type: integer
      refresh_token:
        description: 'Single-use: exchange it at /api/v1/auth/refresh for a new pair.'
        example: q3Jx0yJ8Q0m1yG2ZzVb0bq3s9Xc4m5n6o7p8q9r0s1t
        type: string
      token_type:
        description: 'Always "Bearer": send the token as "Authorization: Bearer <access_token>".'
        example: Bearer
        type: string
    type: object
  handler.TruckResponse:
    properties:
      company_id:
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      id:
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      license_plate:
        example: ABC1234
        type: string
      make:
        example: Freightliner
        type: string
      model:
        example: Cascadia
        type: string
      plate_state:
        example: TX
        type: string
      unit_number:
        example: "101"
        type: string
      updated_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      vin:
        example: 1M8GDM9AXKP042788
        type: string
      year:
        example: 2022
        type: integer
    type: object
  handler.UpdateCompanyRequest:
    properties:
      dot_number:
        example: "1234567"
        type: string
      is_active:
        example: false
        type: boolean
      name:
        example: Acme Freight LLC
        type: string
      timezone:
        example: America/New_York
        type: string
    type: object
  handler.UpdateDriverRequest:
    properties:
      license_expires_at:
        example: "2030-01-15"
        type: string
      license_number:
        example: D7654321
        type: string
      license_state:
        example: OK
        type: string
    type: object
  handler.UpdateELDDeviceRequest:
    properties:
      firmware_version:
        example: 2.0.0
        type: string
      is_active:
        example: false
        type: boolean
      model:
        example: PT30
        type: string
    type: object
  handler.UpdateRateLimitRequest:
    properties:
      limit:
        description: Maximum events per window, per key. 1-10000.
        example: 5
        type: integer
      window_seconds:
        description: Window length in seconds. 1-86400 (24 hours).
        example: 900
        type: integer
    type: object
  handler.UpdateTruckRequest:
    properties:
      is_active:
        example: false
        type: boolean
      license_plate:
        example: XYZ9876
        type: string
      make:
        example: Volvo
        type: string
      model:
        example: VNL 860
        type: string
      plate_state:
        example: OK
        type: string
      unit_number:
        example: 101A
        type: string
      year:
        example: 2023
        type: integer
    type: object
  handler.UpdateUserRequest:
    properties:
      first_name:
        example: Jane
        type: string
      is_active:
        example: false
        type: boolean
      last_name:
        example: Smith
        type: string
      roles:
        example:
        - dispatcher
        - manager
        items:
          type: string
        type: array
    type: object
  handler.UserResponse:
    properties:
      company_id:
        description: Null for platform users.
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
        format: uuid
        type: string
      created_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      email:
        example: jane@acme.com
        type: string
      first_name:
        example: Jane
        type: string
      id:
        example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        format: uuid
        type: string
      is_active:
        example: true
        type: boolean
      last_login_at:
        example: "2026-10-02T11:26:26Z"
        type: string
      last_name:
        example: Smith
        type: string
      roles:
        example:
        - dispatcher
        items:
          type: string
        type: array
      username:
        example: jane.smith
        type: string
    type: object
  handler.VerifyResetCodeRequest:
    properties:
      code:
        description: The 6-digit code from the email.
        example: "048213"
        type: string
      email:
        example: jane@acme.com
        type: string
    type: object
  handler.VerifyResetCodeResponse:
    properties:
      expires_in:
        description: Seconds until the reset token expires.
        example: 600
        type: integer
      reset_token:
        description: 'Single use: send it to /api/v1/auth/password/reset.'
        example: pX3k9Q0m1yG2ZzVb0bq3s9Xc4m5n6o7p8q9r0s1t2u3
        type: string
    type: object
info:
  contact: {}
  description: 'Backend for US motor carriers: companies, users, drivers, trucks and
    ELD devices.'
  title: ELD Fleet Management API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges a login (email or username) and password for an access token and a refresh token.
        Unknown user and wrong password return the same 401 on purpose.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: invalid login or password
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many attempts (rate limits auth_requests or login_attempts,
            see /api/v1/rate-limits); see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: Log in
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: |-
        Ends the session of the given refresh token. Always 204, even for unknown tokens.
        The access token stays valid until it expires (max 15 minutes); clients should discard it.
      parameters:
      - description: Refresh token of the session to end
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests from this IP; see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: Log out
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user, their roles and effective permissions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MeResponse'
        "401":
          description: missing/invalid token, or the user no longer exists
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/password/forgot:
    post:
      consumes:
      - application/json
      description: |-
        Step 1 of 3. Emails a 6-digit code (valid 10 minutes, 5 attempts) if the address belongs to an active account.
        Always answers 202 with the same message, so it never reveals whether an account exists.
        Users without an email address (username-only drivers) must ask an administrator.
      parameters:
      - description: Account email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/handler.ForgotPasswordResponse'
        "400":
          description: invalid JSON or email
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests (rate limits password_reset_requests or auth_requests);
            see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: 'Forgot password: email a code'
      tags:
      - auth
  /api/v1/auth/password/reset:
    post:
      consumes:
      - application/json
      description: Step 3 of 3. Sets the new password, ends every session of the user
        (log in again) and emails a notice.
      parameters:
      - description: Reset token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ResetPasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid JSON, weak new_password, or invalid_reset_token
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests from this IP; see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: 'Forgot password: set a new password'
      tags:
      - auth
  /api/v1/auth/password/verify:
    post:
      consumes:
      - application/json
      description: |-
        Step 2 of 3. Exchanges the emailed code for a single-use reset token (valid 10 minutes).
        Each wrong code uses one of the 5 attempts; then a new code must be requested.
      parameters:
      - description: Email and code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyResetCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.VerifyResetCodeResponse'
        "400":
          description: invalid JSON, or invalid_reset_code (wrong, expired or used
            up)
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests from this IP; see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: 'Forgot password: verify the code'
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges a refresh token for a new access + refresh token pair.
        The presented refresh token stops working (rotation). Presenting it again is treated as theft and ends all sessions of the user.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TokenResponse'
        "400":
          description: invalid JSON
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: invalid or expired refresh token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: account is disabled
          schema:
            $ref: '#/definitions/apierror.Response'
        "429":
          description: too many requests from this IP; see Retry-After
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: Refresh tokens
      tags:
      - auth
  /api/v1/companies:
    get:
      description: |-
        Returns companies ordered by creation time. page_size is capped at 100.
        Platform users see all companies; company users see only their own.
        Requires permission: company:read
      parameters:
      - default: 1
        description: Page number (1-based)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ListCompaniesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission company:read
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: List companies
      tags:
      - companies
    post:
