    patch:
      consumes:
      - application/json
      description: |-
        Requires permission: user:update
        Partial update. roles replaces all roles. Deactivating a user ends all their sessions.
        Nobody can change their own roles or active status.
      parameters:
      - description: User ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission user:update, or changing your own roles/status
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Update a user
      tags:
      - users
  /api/v1/users/{id}/password:
    put:
      consumes:
      - application/json
      description: |-
        Requires permission: user:set_password
        For users who cannot use "forgot password" (e.g. drivers without an email address) or are locked out.
        The user is logged out everywhere. Not for your own account, nor for disabled accounts (activate them first).
      parameters:
      - description: User ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: New password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.SetPasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid id, invalid JSON or weak new_password
          schema:
            $ref: '#/definitions/apierror.Response'
        "401":
          description: missing or invalid access token
          schema:
            $ref: '#/definitions/apierror.Response'
        "403":
          description: missing permission user:set_password, your own account, or
            account is disabled
          schema:
            $ref: '#/definitions/apierror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      security:
      - BearerAuth: []
      summary: Set a user's password
      tags:
      - users
  /api/v1/webhooks/stripe:
    post:
      consumes:
      - application/json
      description: |-
        Called by Stripe, not by clients. No token: the Stripe-Signature header proves the sender.
        200 = handled (or not needed); 400 = not signed by Stripe; 500 = failed, Stripe retries for up to 3 days.
      parameters:
      - description: Signature made by Stripe with the webhook secret
        in: header
        name: Stripe-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: invalid signature
          schema:
            $ref: '#/definitions/apierror.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.Response'
      summary: Stripe webhook
      tags:
      - billing
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Liveness check
      tags:
      - health
  /ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ReadyResponse'
      summary: Readiness check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: 'Access token from /api/v1/auth/login. Enter: Bearer <access_token>'
    in: header
    name: Authorization
    type: apiKey
  DeviceKey:
    description: 'ELD device key from POST /api/v1/eld-devices/{id}/credentials. Enter:
      Device <key>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
