services:
  postgres:
    image: postgres:18-alpine
    container_name: eld-postgres
    environment:
      POSTGRES_USER: eld
      POSTGRES_PASSWORD: eld
      POSTGRES_DB: eld
    ports:
      # host:container. 5433 on the host, because a local Postgres may already use 5432.
      - "5433:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<version>/,
      # so the volume is mounted on the parent directory.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eld -d eld"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Shared rate-limit counters for every API instance (see ratelimit.Redis).
  # Only short-lived counters live here, so persistence is switched off: after
  # a restart every client simply starts with a full bucket.
  redis:
    image: redis:8-alpine
    container_name: eld-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # 6380 on the host, because a local Redis may already use 6379.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Fake mail server for development: catches every email the API sends
  # (nothing reaches real inboxes). Read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: eld-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web inbox

  # The services below only start with the "app" profile, so `make db-up`
  # still starts just Postgres for local development:
  #   docker compose --profile app up --build
  migrate:
    profiles: ["app"]
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://eld:eld@postgres:5432/eld?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network Postgres is "postgres:5432", not localhost:5433.
      DATABASE_URL: postgres://eld:eld@postgres:5432/eld?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      HTTP_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        # Start the API only after migrations finished successfully.
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
